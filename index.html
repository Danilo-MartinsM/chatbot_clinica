<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Clinica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container-fluid vh-100">
    <div class="row h-100">
        
        <!-- Lateral Esquerda (Lista de Pacientes) -->
        <div class="col-md-3 border-end overflow-auto p-0 bg-white">
            <!-- Lista entrará aqui -->
             <div class="p-3 border-bottom bg-light">
                <h6 class="mb-0">Aguardando Atendimento</h6>
            </div>
            
            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action active">
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1">João Silva</h6>
                        <small>10:30</small>
                    </div>
                    <small>Aguardando IA...</small>
                </a>
            </div>
        </div>

        <!-- Área Direita (Janela de Chat) -->
        <div class="col-md-9 bg-light d-flex flex-column p-0">
            <!-- Chat entrará aqui -->
             <!-- Área de rolagem das mensagens -->


            <div class="flex-grow-1 p-3 overflow-auto" id="area-mensagens">
                <!-- Os balões de mensagem vão entrar aqui -->
                 <!-- 1. Balão do Paciente (Alinhado à Esquerda) -->

                <div class="d-flex flex-column align-items-start mb-3">
                    <small class="text-muted mb-1">João Silva - 10:30</small>
                    <div class="p-2 bg-white border rounded shadow-sm" style="max-width: 75%;">
                        Olá, bom dia! A clínica atende pelo plano da Unimed?
                    </div>
                </div>

                <!-- 2. Balão da IA/Clínica (Alinhado à Direita) -->
                <div class="d-flex flex-column align-items-end mb-3">
                    <small class="text-muted mb-1">IA Aurora - 10:31</small>
                    <div class="p-2 bg-primary text-white rounded shadow-sm" style="max-width: 75%;">
                        Olá, João! Sim, nós atendemos Unimed. Você gostaria de verificar os horários disponíveis para agendamento?
                    </div>
                </div>

            </div>

            <!-- Barra inferior de digitação -->
            <div class="p-3 border-top bg-white">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Digite uma mensagem..." id="campo-mensagem">
                    <button class="btn btn-primary" type="button" id="botao-enviar">Enviar</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
