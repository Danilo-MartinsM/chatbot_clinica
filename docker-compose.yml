services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution_db_clinica
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ClinicaSenhaBanco123
      - POSTGRES_DB=evolution
    ports:
      - "5433:5432"
    volumes:
      - evolution_db_dados:/var/lib/postgresql/data

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution_api_clinica
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SERVER_TYPE=NODE
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=ClinicaChaveSecreta123
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      
      # O GOLPE FINAL: Passamos as duas variáveis para calar o Prisma e a API de uma vez por todas
      - DATABASE_CONNECTION_URI=postgresql://postgres:ClinicaSenhaBanco123@postgres:5432/evolution?schema=public
      - DATABASE_URL=postgresql://postgres:ClinicaSenhaBanco123@postgres:5432/evolution?schema=public
      
    volumes:
      - evolution_dados:/evolution/instances

volumes:
  evolution_dados:
  evolution_db_dados: